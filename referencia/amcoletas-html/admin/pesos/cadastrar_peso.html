
<!DOCTYPE html>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Estilos personalizados -->
    <style>
        :root {
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --light-bg: #f8f9fa;
            --dark-bg: #343a40;
            --sidebar-width: 250px;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
        }
        
        .sidebar {
            background-color: var(--secondary-color);
            min-height: 100vh;
            color: white;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 0;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: var(--sidebar-width);
        }
        
        .sidebar-header {
            padding: 1.5rem 1rem;
            background-color: rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
        }
        
        .sidebar-header h3 {
            margin: 0;
            font-size: 1.5rem;
            white-space: nowrap;
        }
        
        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 0.8rem 1rem;
            font-size: 1rem;
            display: flex;
            align-items: center;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .nav-link:hover, .nav-link.active {
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .nav-link i {
            margin-right: 10px;
            font-size: 1.1rem;
        }
        
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 2rem;
        }
        
        .top-bar {
            background-color: white;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .user-info {
            display: flex;
            align-items: center;
        }
        
        .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 1.5rem;
        }
        
        .card-header {
            background-color: white;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-weight: bold;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-primary:hover {
            background-color: #e64a2a;
            border-color: #e64a2a;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 250px;
            }
            
            .sidebar.show {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0;
                padding: 1rem;
                width: 100%;
            }
            
            .top-bar {
                margin-top: 0;
                padding: 0.8rem 1rem;
            }
        }
    </style>
    <!-- Layout padrao do painel admin (igual em todas as telas) -->
        <style>:where(:root){--primary-color: #0d6efd;--secondary-color: #6c757d;}</style>
    <link rel="stylesheet" href="../../assets/css/admin-padrao.css">
</head>
<body>
    <!-- Sidebar / Menu Lateral -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="d-flex align-items-center flex-grow-1" style="min-width:0;">
                                    <img src="../.." alt="" style="display:block;width:100%;max-width:210px;height:auto;max-height:56px;object-fit:contain;background:#fff;padding:6px 10px;border-radius:8px;">
                                <h3></h3>
                            </div>
        </div>
        
        <ul class="nav flex-column">
            <li class="nav-item">
                <a href="../dashboard.html" class="nav-link">
                    <i class="bi bi-speedometer2"></i> <span>Painel de Controle</span>
                </a>
            </li>
            <li class="nav-item">
                                <a href="../notificacoes.html" class="nav-link">
                    <i class="bi bi-bell"></i> <span>Notificações</span>
                                            <span class="badge bg-danger ms-auto rounded-pill"></span>
                                    </a>
            </li>
            <li class="nav-item">
                <a href="../regioes/index.html" class="nav-link">
                    <i class="bi bi-geo-alt"></i> <span>Regiões</span>

                <a href="../tarifas/index.html" class="nav-link active">

            <li class="nav-item">
                <a href="../clientes/index.html" class="nav-link">

                </a>
            </li>
            <li class="nav-item">
                <a href="../motoboys/index.html" class="nav-link">
                    <i class="bi bi-bicycle"></i> <span>Motoboys</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="../entregas/index.html" class="nav-link">
                    <i class="bi bi-box-seam"></i> <span>Entregas</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="../configuracoes/index.html" class="nav-link">
                    <i class="bi bi-gear"></i> <span>Configurações</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="../perfil.html" class="nav-link">
                    <i class="bi bi-key"></i> <span>Alterar Senha</span>
                </a>

            <li class="nav-item mt-5">
                <a href="../../login.html" class="nav-link">
                    <i class="bi bi-box-arrow-right"></i> <span>Sair</span>
                </a>
            </li>
        </ul>
    </div>
    
    <!-- Conteúdo Principal -->
    <div class="main-content">
        <!-- Barra Superior -->
        <div class="top-bar">
            <h1 class="h4 mb-0">Cadastrar Peso Personalizado</h1>
            
            <div class="user-info">
                <img src="https://ui-avatars.com/api/?name=&background=random" alt="Perfil">
                <div>
                    <p class="mb-0 fw-bold"></p>
                    <small class="text-muted">Administrador</small>
                </div>
            </div>
        </div>
        
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
            </div>
                
                    <div class="alert alert- alert-dismissible fade show" role="alert">
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
            </div>
                
        <!-- Formulário de Cadastro -->
        <div class="card">
            <div class="card-header">
                <i class="bi bi-box-seam-fill"></i> Cadastrar Novo Peso Personalizado
            </div>
            <div class="card-body">
                <form action="cadastrar_peso.html" method="post">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="peso" class="form-label">Peso (kg) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" min="0.01" class="form-control" id="peso" name="peso" value="" required>
                            <small class="form-text text-muted">Ex: 10.50</small>
                        </div>
                        <div class="col-md-6">
                            <label for="valor" class="form-label">Valor (R$) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" min="0.01" class="form-control" id="valor" name="valor" value="" required>
                            <small class="form-text text-muted">Ex: 25.00</small>
                        </div>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="ativo" name="ativo" >
                        <label class="form-check-label" for="ativo">Ativo</label>
                    </div>
                    
                    <div class="d-flex justify-content-end">
                        <a href="index.html" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
