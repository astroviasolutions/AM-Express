
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Senha - Administrador</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Estilos personalizados -->
    <style>
        :root {
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --light-bg: #f8f9fa;
            --dark-bg: #343a40;
            --sidebar-width: 250px;
            --sidebar-width-collapsed: 70px;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
        }
        
        .sidebar {
            background-color: var(--secondary-color);
            height: 100vh;
            color: white;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 0;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: var(--sidebar-width);
        }
        
        .sidebar-header {
            padding: 1.5rem 1rem;
            background-color: rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .sidebar-header h3 {
            margin: 0;
            font-size: 1.5rem;
            white-space: nowrap;
        }
        
        .sidebar-header span {
            color: var(--primary-color);
        }
        
        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 0.8rem 1rem;
            font-size: 1rem;
            display: flex;
            align-items: center;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .nav-link:hover, .nav-link.active {
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .nav-link i {
            margin-right: 10px;
            font-size: 1.1rem;
        }
        
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 2rem;
        }
        
        .top-bar {
            background-color: white;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .user-info {
            display: flex;
            align-items: center;
        }
        
        .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 1.5rem;
        }
        
        .card-header {
            background-color: white;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-weight: bold;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-primary:hover {
            background-color: #e64a2a;
            border-color: #e64a2a;
        }
        
        .btn-secondary {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
        }
        
        .btn-secondary:hover {
            background-color: #152c6b;
            border-color: #152c6b;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 250px;
            }
            
            .sidebar.show {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0;
                padding: 1rem;
                width: 100%;
            }
            
            .mobile-toggle {
                display: block;
            }
            
            .top-bar {
                margin-top: 0;
                padding: 0.8rem 1rem;
            }
        }
    </style>
    <!-- Layout padrao do painel admin (igual em todas as telas) -->
        <style>:where(:root){--primary-color: #0d6efd;--secondary-color: #6c757d;}</style>
    <link rel="stylesheet" href="../assets/css/admin-padrao.css">
</head>
<body>
    <!-- Sidebar / Menu Lateral -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="d-flex align-items-center flex-grow-1" style="min-width:0;">
                                    <img src=".." alt="" style="display:block;width:100%;max-width:210px;height:auto;max-height:56px;object-fit:contain;background:#fff;padding:6px 10px;border-radius:8px;">
                                <h3></h3>
                            </div>
        </div>
        
        <ul class="nav flex-column">
            <li class="nav-item">
                <a href="dashboard.html" class="nav-link">
                    <i class="bi bi-speedometer2"></i> <span>Painel de Controle</span>
                </a>
            </li>
            <li class="nav-item">
                                <a href="notificacoes.html" class="nav-link">
                    <i class="bi bi-bell"></i> <span>Notificações</span>
                                            <span class="badge bg-danger ms-auto rounded-pill"></span>
                                    </a>
            </li>
            <li class="nav-item">
                <a href="regioes/index.html" class="nav-link">
                    <i class="bi bi-geo-alt"></i> <span>Regiões</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="tarifas/index.html" class="nav-link">
                    <i class="bi bi-cash-coin"></i> <span>Tarifas</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="clientes/index.html" class="nav-link">
                    <i class="bi bi-people"></i> <span>Clientes</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="motoboys/index.html" class="nav-link">
                    <i class="bi bi-bicycle"></i> <span>Motoboys</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="entregas/index.html" class="nav-link">
                    <i class="bi bi-box-seam"></i> <span>Entregas</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="configuracoes/index.html" class="nav-link">
                    <i class="bi bi-gear"></i> <span>Configurações</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="perfil.html" class="nav-link active">
                    <i class="bi bi-key"></i> <span>Alterar Senha</span>
                </a>
            </li>
            <li class="nav-item mt-5">
                <a href="../login.html" class="nav-link">
                    <i class="bi bi-box-arrow-right"></i> <span>Sair</span>
                </a>
            </li>
        </ul>
    </div>
    
    <!-- Conteúdo Principal -->
    <div class="main-content" id="mainContent">
        <!-- Barra Superior -->
        <div class="top-bar">
            <div class="d-flex align-items-center">
            <h1 class="h4 mb-0">Cadastrar Estado</h1>
            </div>
            
            <div class="user-info">
                <img src="https://ui-avatars.com/api/?name=&background=random" alt="Perfil">
                <div>
                    <p class="mb-0 fw-bold"></p>
                    <small class="text-muted">Administrador</small>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-key"></i> Alterar minha senha
                    </div>
                    <div class="card-body">
                                                    <div class="alert alert-success"></div>
                                                                            <div class="alert alert-danger">
                                <ul class="mb-0">
                                                                            <li></li>
                                                                    </ul>
                            </div>
                        
                        <form method="post" action="" autocomplete="off">
                            <input type="hidden" name="token" value="">
                            <div class="mb-3">
                                <label for="senha_atual" class="form-label">Senha atual <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="senha_atual" name="senha_atual" required autocomplete="current-password">
                            </div>
                            <div class="mb-3">
                                <label for="nova_senha" class="form-label">Nova senha <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="nova_senha" name="nova_senha" minlength="8" required autocomplete="new-password">
                                <div class="form-text">Mínimo de 8 caracteres. Use letras, números e símbolos.</div>
                            </div>
                            <div class="mb-3">
                                <label for="confirmar_senha" class="form-label">Confirmar nova senha <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha" minlength="8" required autocomplete="new-password">
                            </div>
                            <div class="d-flex justify-content-end gap-2">
                                <a href="dashboard.html" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Salvar nova senha</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
