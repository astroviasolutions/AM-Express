
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download de Fatura - Administração</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .download-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .success-icon {
            font-size: 60px;
            color: #28a745;
            margin-bottom: 20px;
        }
        .btn-primary {
            background-color: #FA5430;
            border-color: #FA5430;
        }
        .btn-primary:hover {
            background-color: #e64a2a;
            border-color: #e64a2a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="download-container">
            <div class="success-icon">
                <i class="bi bi-check-circle-fill"></i>
            </div>
            <h2 class="mb-4">Faturamento Resetado com Sucesso</h2>
            <p class="mb-4">O faturamento do cliente <strong></strong> foi resetado e todas as entregas foram marcadas como faturadas.</p>
            
            <div class="mb-4">
                <p>Um arquivo CSV com todas as informações da fatura foi gerado.</p>
                <p>Clique no botão abaixo para fazer o download:</p>
            </div>
            
            <div class="d-grid gap-2">
                <a href="" download class="btn btn-primary btn-lg">
                    <i class="bi bi-download me-2"></i> Baixar Fatura
                </a>
                <a href="index.html" class="btn btn-outline-secondary mt-3">
                    <i class="bi bi-arrow-left me-2"></i> Voltar para Lista de Clientes
                </a>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Iniciar download automático após 1 segundo
        setTimeout(function() {
            document.querySelector('a[download]').click();
        }, 1000);
    </script>
</body>
</html>
