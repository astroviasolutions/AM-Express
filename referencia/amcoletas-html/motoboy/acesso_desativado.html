
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Desativado - </title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .message-container {
            max-width: 600px;
            width: 100%;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            text-align: center;
        }
        
        .message-icon {
            color: var(--primary-color);
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-primary:hover {
            background-color: #e64a2a;
            border-color: #e64a2a;
        }
        
        .contact-info {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 1.5rem;
            margin-top: 1.5rem;
            text-align: left;
        }
        
        .contact-info i {
            margin-right: 8px;
            color: var(--secondary-color);
        }
    </style>
</head>
<body>
    <div class="message-container">
        <div class="message-icon">
            <i class="bi bi-exclamation-circle-fill"></i>
        </div>
        
        <h2>Acesso Desativado</h2>
        
        <p class="mb-4">Olá, <strong></strong>!</p>
        
        <div class="alert alert-warning">
            <p>Sua conta de motoboy foi <strong>desativada</strong> pelo administrador do sistema.</p>
            <p>Para mais informações ou reativar sua conta, entre em contato com o administrador usando as informações abaixo.</p>
        </div>
        
        <div class="contact-info">
            <h5>Contato do Administrador</h5>
                            <p><i class="bi bi-telephone-fill"></i> <a href="tel:"></a></p>
                        
                            <p><i class="bi bi-envelope-fill"></i> <a href="mailto:"></a></p>
                        
                            <p><i class="bi bi-geo-alt-fill"></i> </p>
                    </div>
        
        <div class="mt-4">
            <a href="../login.html" class="btn btn-primary">Voltar para o Login</a>
        </div>
        
        <p class="mt-4 text-muted small">&copy;  </p>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
