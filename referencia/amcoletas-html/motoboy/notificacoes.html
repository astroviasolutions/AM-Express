  <script>
        // Funcionalidade para o menu lateral recolhível
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.getElementById('sidebar');
            const sidebarToggle = document.getElementById('sidebarToggle');
            const mainContent = document.getElementById('mainContent');
            const mobileToggle = document.getElementById('mobileToggle');
            
            // Função para alternar o menu lateral em desktop
            if(sidebarToggle) {
                sidebarToggle.addEventListener('click', function() {
                    sidebar.classList.toggle('collapsed');
                    mainContent.classList.toggle('expanded');
                    
                    // Alterna o ícone do botão
                    const icon = sidebarToggle.querySelector('i');
                    if (icon.classList.contains('bi-chevron-left')) {
                        icon.classList.replace('bi-chevron-left', 'bi-chevron-right');
                    } else {
                        icon.classList.replace('bi-chevron-right', 'bi-chevron-left');
                    }
                });
            }
            
            // Função para alternar o menu lateral em dispositivos móveis
            if(mobileToggle) {
                mobileToggle.addEventListener('click', function() {
                    sidebar.classList.toggle('show');
                });
            }
            
            // Fechar o menu ao clicar fora dele em dispositivos móveis
            document.addEventListener('click', function(event) {
                const isClickInsideSidebar = sidebar.contains(event.target);
                const isClickOnMobileToggle = mobileToggle.contains(event.target);
                
                if (window.innerWidth <= 768 && !isClickInsideSidebar && !isClickOnMobileToggle && sidebar.classList.contains('show')) {
                    sidebar.classList.remove('show');
                }
            });
            
            // Ajustar em caso de redimensionamento da tela
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768 && sidebar.classList.contains('show')) {
                    sidebar.classList.remove('show');
                }
            });
        });
    </script>
