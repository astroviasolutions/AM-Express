
<!DOCTYPE html>

<head>

    <!-- Estilos personalizados -->
    <style>
        :root {
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --light-bg: #f8f9fa;
            --dark-bg: #343a40;
            --sidebar-width: 250px;
            --sidebar-width-collapsed: 70px;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            overflow-x: hidden;
        }
        
        .sidebar {
            background-color: var(--secondary-color);
            height: 100vh;
            color: white;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 0;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: var(--sidebar-width);
            transition: all 0.3s ease-in-out;
        }
        
        .sidebar.collapsed {
            width: var(--sidebar-width-collapsed);
        }
        
        .sidebar-header {
            padding: 1.5rem 1rem;
            background-color: rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .sidebar-header h3 {
            margin: 0;
            font-size: 1.5rem;
            white-space: nowrap;
        }
        
        .sidebar.collapsed .sidebar-header h3 {
            display: none;
        }
        
        .sidebar-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.5rem;
            padding: 0;
        }
        
        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 0.8rem 1rem;
            font-size: 1rem;
            display: flex;
            align-items: center;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .sidebar.collapsed .nav-link span {
            display: none;
        }
        
        .nav-link:hover, .nav-link.active {
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .nav-link i {
            margin-right: 10px;
            font-size: 1.1rem;
            min-width: 24px;
            text-align: center;
        }
        
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 2rem;
            transition: all 0.3s ease-in-out;
        }
        
        .main-content.expanded {
            margin-left: var(--sidebar-width-collapsed);
        }
        
        .top-bar {
            background-color: white;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--secondary-color);
            font-size: 1.5rem;
            margin-right: 1rem;
            cursor: pointer;
        }
        
        .user-info {
            display: flex;
            align-items: center;
        }
        
        .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        .notification-badge {
            position: relative;
            display: inline-block;
        }
        
        .notification-badge .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: var(--primary-color);
        }
        
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 1.5rem;
        }
        
        .card-header {
            background-color: white;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-weight: bold;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-primary:hover, .btn-primary:focus {
            background-color: #e64a2a;
            border-color: #e64a2a;
        }
        
        .form-label {
            font-weight: 500;
        }
        
        .required::after {
            content: ' *';
            color: var(--primary-color);
        }
        
        /* Media queries para responsividade */
        @media (max-width: 992px) {
            :root {
                --sidebar-width: 200px;
            }
            
            .sidebar-toggle {
                display: block;
            }
            
            .sidebar-header h3 {
                font-size: 1.2rem;
            }
        }
        
        @media (max-width: 768px) {
            :root {
                --sidebar-width: 0px;
            }
            
            .sidebar {
                transform: translateX(-100%);
                width: 250px;
            }
            
            .sidebar.show {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0;
                padding: 1rem;
                width: 100%;
            }
            
            .mobile-toggle {
                display: block;
            }
            
            .top-bar {
                margin-top: 0;
                padding: 0.8rem 1rem;
            }
            
            .top-bar h1 {
                font-size: 1.2rem;
            }
            
            .user-info p {
                font-size: 0.9rem;
            }
            
            .user-info small {
                font-size: 0.7rem;
            }
        }
        
        @media (max-width: 576px) {
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .user-info {
                margin-top: 1rem;
            }
        }
    </style>
</head>

    <!-- Conteúdo Principal -->

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <script>
        // Funcionalidade para o menu lateral recolhível
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.getElementById('sidebar');
            const sidebarToggle = document.getElementById('sidebarToggle');
            const mainContent = document.getElementById('mainContent');
            const mobileToggle = document.getElementById('mobileToggle');
            
            // Função para alternar o menu lateral em desktop
            if(sidebarToggle) {
                sidebarToggle.addEventListener('click', function() {
                    sidebar.classList.toggle('collapsed');
                    mainContent.classList.toggle('expanded');
                    
                    // Alterna o ícone do botão
                    const icon = sidebarToggle.querySelector('i');
                    if (icon.classList.contains('bi-chevron-left')) {
                        icon.classList.replace('bi-chevron-left', 'bi-chevron-right');
                    } else {
                        icon.classList.replace('bi-chevron-right', 'bi-chevron-left');
                    }
                });
            }
            
            // Função para alternar o menu lateral em dispositivos móveis
            if(mobileToggle) {
                mobileToggle.addEventListener('click', function() {
                    sidebar.classList.toggle('show');
                });
            }
            
            // Fechar o menu ao clicar fora dele em dispositivos móveis
            document.addEventListener('click', function(event) {
                const isClickInsideSidebar = sidebar.contains(event.target);
                const isClickOnMobileToggle = mobileToggle.contains(event.target);
                
                if (window.innerWidth <= 768 && !isClickInsideSidebar && !isClickOnMobileToggle && sidebar.classList.contains('show')) {
                    sidebar.classList.remove('show');
                }
            });
            
            // Ajustar em caso de redimensionamento da tela
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768 && sidebar.classList.contains('show')) {
                    sidebar.classList.remove('show');
                }
            });
        });
        
        // Código para carregar cidades quando o estado é selecionado
        $(document).ready(function() {
            $('#estado_id').change(function() {
                var estadoId = $(this).val();
                var cidadeSelect = $('#cidade_id');
                
                cidadeSelect.prop('disabled', true);
                cidadeSelect.html('<option value="">Carregando...</option>');
            
            if (estadoId) {
                    $.ajax({
                        url: '../admin/regioes/buscar_cidades.php',
                        type: 'GET',
                        data: { estado_id: estadoId },
                        dataType: 'json',
                        success: function(data) {
                            cidadeSelect.html('<option value="">Selecione uma cidade</option>');
                            
                            $.each(data, function(key, value) {
                                cidadeSelect.append('<option value="' + value.id + '">' + value.nome + '</option>');
                            });
                            
                            cidadeSelect.prop('disabled', false);
                        },
                        error: function() {
                            cidadeSelect.html('<option value="">Erro ao carregar cidades</option>');
                        }
                    });
            } else {
                    cidadeSelect.html('<option value="">Selecione um estado primeiro</option>');
            }
            });
        });
        
        // Máscara para CPF/CNPJ
        const cpfCnpjInput = document.getElementById('cpf_cnpj');
        cpfCnpjInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            
            if (value.length <= 11) {
                // CPF
                if (value.length > 9) {
                    value = value.replace(/^(\d{3})(\d{3})(\d{3})(\d{0,2})$/, "$1.$2.$3-$4");
                } else if (value.length > 6) {
                    value = value.replace(/^(\d{3})(\d{3})(\d{0,3})$/, "$1.$2.$3");
                } else if (value.length > 3) {
                    value = value.replace(/^(\d{3})(\d{0,3})$/, "$1.$2");
                }
            } else {
                // CNPJ
                if (value.length > 12) {
                    value = value.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})$/, "$1.$2.$3/$4-$5");
                } else if (value.length > 8) {
                    value = value.replace(/^(\d{2})(\d{3})(\d{3})(\d{0,4})$/, "$1.$2.$3/$4");
                } else if (value.length > 5) {
                    value = value.replace(/^(\d{2})(\d{3})(\d{0,3})$/, "$1.$2.$3");
                } else if (value.length > 2) {
                    value = value.replace(/^(\d{2})(\d{0,3})$/, "$1.$2");
                }
            }
            
            e.target.value = value;
        });
        
        // Máscara para telefone
        const telefoneInput = document.getElementById('telefone');
        telefoneInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            
            if (value.length > 10) {
                value = value.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
            } else if (value.length > 6) {
                value = value.replace(/^(\d{2})(\d{4})(\d{0,4})$/, "($1) $2-$3");
            } else if (value.length > 2) {
                value = value.replace(/^(\d{2})(\d{0,5})$/, "($1) $2");
            }
            
            e.target.value = value;
        });
        
        // Máscara para CEP
        const cepInput = document.getElementById('cep');
        cepInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            
            if (value.length > 5) {
                value = value.replace(/^(\d{5})(\d{0,3})$/, "$1-$2");
            }
            
            e.target.value = value;
        });
    </script>
